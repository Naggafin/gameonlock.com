{% load i18n %}
{{ form.non_field_errors }}
<div class="row">
    <div class="col-xl-6 col-lg-6 col-md-6">
        <label for="{{ form.name.id_for_label }}" class="form-label">
            <span>{{ form.name.label }}</span>
        </label>
        <input type="text"
               id="{{ form.name.id_for_label }}"
               name="{{ form.name.name }}"
               class="form-control
                      {% if form.name.errors %}is-invalid{% endif %}"
               placeholder="{% trans 'Ex: john' %}"
               aria-labeledby="{{ form.name.id_for_label }}-feedback">
        <div id="{{ form.name.id_for_label }}-feedback" class="invalid-feedback">{{ form.name.errors }}</div>
    </div>
    <div class="col-xl-6 col-lg-6 col-md-6">
        <label for="{{ form.email.id_for_label }}" class="form-label">
            <span>{{ form.email.label }}</span>
        </label>
        <input type="text"
               id="{{ form.email.id_for_label }}"
               name="{{ form.email.name }}"
               class="form-control
                      {% if form.email.errors %}is-invalid{% endif %}"
               placeholder="{% trans 'Ex: john@example.com' %}"
               aria-labeledby="{{ form.email.id_for_label }}-feedback">
        <div id="{{ form.email.id_for_label }}-feedback" class="invalid-feedback">{{ form.email.errors }}</div>
    </div>
    <div class="col-xl-12 col-lg-12">
        <label for="{{ form.body.id_for_label }}" class="form-label">
            <span>{{ form.body.label }}</span>
        </label>
        <textarea id="{{ form.body.id_for_label }}"
                  name="{{ form.body.name }}"
                  class="form-control
                         {% if form.body.errors %}
                             is-invalid
                         {% endif %}"
                  placeholder="{% trans "Ex: Hello, I'm writing about..." %}"
                  aria-labeledby="{{ form.body.id_for_label }}-feedback"></textarea>
        <div id="{{ form.body.id_for_label }}-feedback" class="invalid-feedback">{{ form.body.errors }}</div>
    </div>
</div>
